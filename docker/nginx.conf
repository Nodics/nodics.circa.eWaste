server {
    listen 8080;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location ^~ /nodics/profile/ { set $upstream "host.docker.internal:5300"; proxy_pass http://$upstream; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 180s; client_max_body_size 12m; }
    location ^~ /nodics/commsApi/ { set $upstream "host.docker.internal:5340"; proxy_pass http://$upstream; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 180s; client_max_body_size 12m; }
    location ^~ /nodics/locationMap/ { set $upstream "host.docker.internal:5380"; proxy_pass http://$upstream; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 180s; client_max_body_size 12m; }
    location ^~ /nodics/cms/ { set $upstream "host.docker.internal:5314"; proxy_pass http://$upstream; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 180s; client_max_body_size 12m; }
    location ^~ /nodics/media/v0/content/ { set $upstream "host.docker.internal:5314"; proxy_pass http://$upstream; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 180s; client_max_body_size 12m; }
    location ^~ /nodics/media/ { set $upstream "host.docker.internal:5312"; proxy_pass http://$upstream; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 180s; client_max_body_size 12m; }
    location ^~ /nodics/ { set $upstream "host.docker.internal:5370"; proxy_pass http://$upstream; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 180s; client_max_body_size 12m; }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ { expires 1h; add_header Cache-Control "public, immutable"; }
}
